name: Trigger auto deployment for cxmanager-api

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/cxmanager-api-AutoDeployTrigger-3dbb9d76-e92e-4e3c-87be-e8e49fdcd722.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CXMANAGERAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CXMANAGERAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CXMANAGERAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/src/backend/CxManager
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: acrcxmanager.azurecr.io
          registryUsername: ${{ secrets.CXMANAGERAPI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CXMANAGERAPI_REGISTRY_PASSWORD }}
          containerAppName: cxmanager-api
          resourceGroup: rg-cxmanager
          imageToBuild: acrcxmanager.azurecr.io/cxmanager-api:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_



name: Trigger auto deployment for cxmanager-web

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/cxmanager-web-AutoDeployTrigger-4858a075-e2e5-4929-812f-b4729e7ac97e.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CXMANAGERWEB_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CXMANAGERWEB_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CXMANAGERWEB_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/src/frontend
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: acrcxmanager.azurecr.io
          registryUsername: ${{ secrets.CXMANAGERWEB_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CXMANAGERWEB_REGISTRY_PASSWORD }}
          containerAppName: cxmanager-web
          resourceGroup: rg-cxmanager
          imageToBuild: acrcxmanager.azurecr.io/cxmanager-web:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


